name: Данные приложения
# Раз в день: коды KVERT публикуются сами, о новой сводке Минтуризма приходит задача (issue).
# Решение Никиты 20.11.2026: проверка на сервере GitHub вместо задачи Claude на Mac.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Коды KVERT
        run: python3 tools/kvert_server.py
      - name: Опубликовать, если изменилось
        run: |
          if ! git diff --quiet -- activity.json updates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Коды KVERT: прогноз от $(python3 -c 'import json;print(json.load(open("activity.json"))["forecastDate"])')" -- activity.json updates.json
            git push
          fi
      - name: Новая сводка Минтуризма
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/mintur_watch.py
